<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ΤΑΒΛΑΚΙ ΣΤΟ ΛΙΘΙ</title>
    <style>
        :root {
            --bg-color: #121212;
            --board-wood: #3d2314;
            --board-border: #211107;
            --point-dark: #2a2a2a;
            --point-light: #b86b25;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 920px;
            background: #1e1e1e;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #333;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #f1c40f;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls-top {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #34495e;
        }

        .main-container {
            display: flex;
            gap: 20px;
            max-width: 920px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .sidebar {
            flex: 1;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 1px solid #333;
        }

        .panel h3 {
            margin-top: 0;
            font-size: 0.95rem;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
            color: #bdc3c7;
        }

        /* Ταμπλό Τάβλι */
        .board-container {
            position: relative;
            background-color: var(--board-wood);
            border: 12px solid var(--board-border);
            border-radius: 14px;
            width: 660px;
            height: 440px;
            display: flex;
            box-shadow: 0 12px 30px rgba(0,0,0,0.8);
            box-sizing: border-box;
        }

        .board-half {
            flex: 1;
            display: flex;
            height: 100%;
        }

        .quadrant {
            flex: 1;
            display: flex;
            height: 100%;
        }

        /* Κάθε στήλη (τρίγωνο) */
        .point-col {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
        }

        .point-top {
            height: 50%;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }

        .point-bot {
            height: 50%;
            position: relative;
            margin-top: auto;
            clip-path: polygon(0 100%, 100% 100%, 50% 0);
        }

        .point-col.dark .point-top, .point-col.dark .point-bot { background-color: var(--point-dark); }
        .point-col.light .point-top, .point-col.light .point-bot { background-color: var(--point-light); }

        .point-number {
            position: absolute;
            font-size: 9px;
            color: #ddd;
            z-index: 3;
            width: 100%;
            text-align: center;
            pointer-events: none;
            font-weight: bold;
        }
        .point-col .point-number.top-num { top: 4px; }
        .point-col .point-number.bot-num { bottom: 4px; }

        .bar {
            width: 40px;
            background-color: #211107;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-left: 2px solid #110803;
            border-right: 2px solid #110803;
            position: relative;
        }

        /* Πούλια */
        .checker-container {
            position: absolute;
            width: 100%;
            height: 50%;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            left: 0;
        }

        .checker-container.top { top: 0; justify-content: flex-start; padding-top: 4px; }
        .checker-container.bot { bottom: 0; justify-content: flex-end; padding-bottom: 4px; }

        .checker {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: bold;
            margin: 1px 0;
            transition: transform 0.1s;
        }

        .checker.yellow {
            background: radial-gradient(circle at 30% 30%, #f1c40f, #d4ac0d);
            border: 2px solid #9a7d0a;
            color: #5a4705;
        }

        .checker.green {
            background: radial-gradient(circle at 30% 30%, #2ecc71, #27ae60);
            border: 2px solid #145a32;
            color: #0b321c;
        }

        .checker.selected {
            box-shadow: 0 0 10px 3px #3498db, 0 3px 6px rgba(0,0,0,0.6);
            transform: scale(1.15);
        }

        .dice-area {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 10px 0;
        }

        .die {
            width: 40px;
            height: 40px;
            background: white;
            color: black;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .log-box {
            background: #121212;
            padding: 10px;
            border-radius: 6px;
            height: 110px;
            overflow-y: auto;
            font-size: 11px;
            font-family: monospace;
            border: 1px solid #333;
        }

        .bear-off {
            position: absolute;
            right: -52px;
            width: 44px;
            height: 46%;
            background: rgba(0,0,0,0.4);
            border: 1px solid #333;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px;
            gap: 2px;
        }
        .bear-off.top { top: 0; }
        .bear-off.bottom { bottom: 0; }
    </style>
</head>
<body>

    <header>
        <h1>🎲 ΤΑΒΛΑΚΙ ΣΤΟ ΛΙΘΙ</h1>
        <div class="controls-top">
            <span id="series-score" style="font-size: 0.85rem; color: #f1c40f;">Σκορ: Κίτρινες 0 - 0 Πράσινες</span>
            <button id="mode-btn" onclick="toggleMode()">👥 2 Παίκτες</button>
            <button onclick="startNewSeries()">🔄 Νέα Σειρά</button>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="panel">
                <h3>ΚΑΤΑΣΤΑΣΗ ΠΑΙΧΝΙΔΙΟΥ</h3>
                <p id="game-status" style="font-weight: bold; color: #f1c40f; font-size: 0.9rem;">Ρίψτε τα ζάρια!</p>
                <div class="dice-area">
                    <div id="die1" class="die">-</div>
                    <div id="die2" class="die">-</div>
                    <button id="roll-btn" onclick="rollDice()" style="background: #27ae60; padding: 10px 14px;">🎲 Ρίψη</button>
                </div>
            </div>

            <div class="panel">
                <h3>ΙΣΤΟΡΙΚΟ ΚΙΝΗΣΕΩΝ</h3>
                <div id="log-container" class="log-box">
                    Το παιχνίδι ξεκίνησε. Καλή διασκέδαση!
                </div>
            </div>
        </div>

        <div class="board-container" id="board">
            <div class="bear-off top" id="bear-off-green" title="Μαζεμένα Πράσινα"></div>
            <div class="bear-off bottom" id="bear-off-yellow" title="Μαζεμένα Κίτρινα"></div>

            <!-- Left Half -->
            <div class="board-half">
                <div class="quadrant" id="q-top-left"></div>
                <div class="quadrant" id="q-bot-left"></div>
            </div>
            <div class="bar" id="bar-area"></div>
            <!-- Right Half -->
            <div class="board-half">
                <div class="quadrant" id="q-top-right"></div>
                <div class="quadrant" id="q-bot-right"></div>
            </div>
        </div>
    </div>

<script>
    let gameState = {
        board: Array(25).fill(null).map(() => []),
        turn: 'yellow',
        dice: [],
        usedDice: [],
        selectedPoint: null,
        borneOff: { yellow: 0, green: 0 },
        gameIndex: 0,
        gameTypes: ['Πόρτες', 'Πλακωτό', 'Φευγά'],
        seriesScore: { yellow: 0, green: 0 },
        againstAI: false,
        phase: 'roll'
    };

    function initGameType() {
        gameState.board = Array(25).fill(null).map(() => []);
        gameState.borneOff = { yellow: 0, green: 0 };
        gameState.turn = 'yellow';
        gameState.dice = [];
        gameState.usedDice = [];
        gameState.selectedPoint = null;
        gameState.phase = 'roll';

        const type = gameState.gameTypes[gameState.gameIndex];
        logMessage(`Ξεκίνησε το ${type}! Σειρά των Κίτρινων.`);

        if (type === 'Πόρτες') {
            gameState.board[1] = Array(2).fill('yellow');
            gameState.board[12] = Array(5).fill('yellow');
            gameState.board[17] = Array(3).fill('yellow');
            gameState.board[19] = Array(5).fill('yellow');

            gameState.board[24] = Array(2).fill('green');
            gameState.board[13] = Array(5).fill('green');
            gameState.board[8] = Array(3).fill('green');
            gameState.board[6] = Array(5).fill('green');
        } else if (type === 'Πλακωτό') {
            gameState.board[1] = Array(15).fill('yellow');
            gameState.board[24] = Array(15).fill('green');
        } else if (type === 'Φευγά') {
            gameState.board[1] = Array(15).fill('yellow');
            gameState.board[13] = Array(15).fill('green');
        }
        renderBoard();
        updateUI();
    }

    function renderBoard() {
        const qTL = document.getElementById('q-top-left');
        const qBL = document.getElementById('q-bot-left');
        const qTR = document.getElementById('q-top-right');
        const qBR = document.getElementById('q-bot-right');

        qTL.innerHTML = ''; qBL.innerHTML = ''; qTR.innerHTML = ''; qBR.innerHTML = '';

        // Traditional layout:
        // Top-Left quadrant: 12, 11, 10, 9, 8, 7 (Top row, pointing down)
        // Bottom-Left quadrant: 13, 14, 15, 16, 17, 18 (Bottom row, pointing up)
        // Top-Right quadrant: 6, 5, 4, 3, 2, 1 (Top row, pointing down)
        // Bottom-Right quadrant: 19, 20, 21, 22, 23, 24 (Bottom row, pointing up)

        renderQuadrantCols(qTL, [12, 11, 10], 'top', 'top');
        renderQuadrantCols(qBL, [9, 8, 7], 'top', 'bot');
        renderQuadrantCols(qTR, [13, 14, 15], 'bot', 'top');
        renderQuadrantCols(qBR, [16, 17, 18], 'bot', 'bot');
        
        // Wait, let's map standard 4 blocks cleanly:
        // Let's create a direct render function for each of the 4 quarters of 6 points:
        renderPointsGroup(qTL, [12, 11, 10, 9, 8, 7], 'top');
        renderPointsGroup(qBL, [13, 14, 15, 16, 17, 18], 'bottom');
        renderPointsGroup(qTR, [6, 5, 4, 3, 2, 1], 'top');
        renderPointsGroup(qBR, [19, 20, 21, 22, 23, 24], 'bottom');

        renderBearOff();
    }

    function renderPointsGroup(container, indices, verticalHalf) {
        indices.forEach(idx => {
            const col = document.createElement('div');
            col.className = `point-col ${idx % 2 === 0 ? 'dark' : 'light'}`;
            col.onclick = () => onPointClick(idx);

            const num = document.createElement('div');
            num.className = `point-number ${verticalHalf === 'top' ? 'top-num' : 'bot-num'}`;
            num.innerText = idx;
            col.appendChild(num);

            if (verticalHalf === 'top') {
                const tri = document.createElement('div');
                tri.className = 'point-top';
                col.appendChild(tri);

                const chkCont = document.createElement('div');
                chkCont.className = 'checker-container top';
                const checkers = gameState.board[idx];
                checkers.forEach((color, cIdx) => {
                    if (cIdx < 6) {
                        const chk = document.createElement('div');
                        chk.className = `checker ${color} ${gameState.selectedPoint === idx && cIdx === checkers.length - 1 ? 'selected' : ''}`;
                        chkCont.appendChild(chk);
                    }
                });
                col.appendChild(chkCont);
            } else {
                const chkCont = document.createElement('div');
                chkCont.className = 'checker-container bot';
                const checkers = gameState.board[idx];
                checkers.forEach((color, cIdx) => {
                    if (cIdx < 6) {
                        const chk = document.createElement('div');
                        chk.className = `checker ${color} ${gameState.selectedPoint === idx && cIdx === checkers.length - 1 ? 'selected' : ''}`;
                        chkCont.appendChild(chk);
                    }
                });
                col.appendChild(chkCont);

                const tri = document.createElement('div');
                tri.className = 'point-bot';
                col.appendChild(tri);
            }

            container.appendChild(col);
        });
    }

    function renderBearOff() {
        document.getElementById('bear-off-green').innerHTML = `<small style="font-size:9px">Π:${gameState.borneOff.green}</small>`;
        document.getElementById('bear-off-yellow').innerHTML = `<small style="font-size:9px">Κ:${gameState.borneOff.yellow}</small>`;
    }

    function rollDice() {
        if (gameState.phase !== 'roll') return;
        const d1 = Math.floor(Math.random() * 6) + 1;
        const d2 = Math.floor(Math.random() * 6) + 1;
        gameState.dice = d1 === d2 ? [d1, d1, d1, d1] : [d1, d2];
        gameState.usedDice = [];
        gameState.phase = 'move';

        document.getElementById('die1').innerText = d1;
        document.getElementById('die2').innerText = d2;
        logMessage(`Ρίψη: ${d1}, ${d2} (${gameState.turn === 'yellow' ? 'Κίτρινες' : 'Πράσινες'})`);
        updateUI();
    }

    function onPointClick(idx) {
        if (gameState.phase !== 'move') return;
        const current = gameState.turn;

        if (gameState.selectedPoint === null) {
            const checkers = gameState.board[idx];
            if (checkers.length > 0 && checkers[checkers.length - 1] === current) {
                gameState.selectedPoint = idx;
                renderBoard();
            }
        } else {
            const from = gameState.selectedPoint;
            const to = idx;
            if (isValidMove(from, to)) {
                executeMove(from, to);
                gameState.selectedPoint = null;
                checkCompletion();
            } else {
                const checkers = gameState.board[idx];
                if (checkers.length > 0 && checkers[checkers.length - 1] === current) {
                    gameState.selectedPoint = idx;
                } else {
                    gameState.selectedPoint = null;
                }
                renderBoard();
            }
        }
    }

    function isValidMove(from, to) {
        const dist = Math.abs(to - from);
        return gameState.dice.some((d, i) => !gameState.usedDice.includes(i) && d === dist);
    }

    function executeMove(from, to) {
        const dist = Math.abs(to - from);
        const dIdx = gameState.dice.findIndex((d, i) => !gameState.usedDice.includes(i) && d === dist);
        if (dIdx !== -1) gameState.usedDice.push(dIdx);

        const piece = gameState.board[from].pop();
        gameState.board[to].push(piece);
        logMessage(`Κίνηση από ${from} σε ${to}`);
        renderBoard();
    }

    function checkCompletion() {
        if (gameState.usedDice.length === gameState.dice.length) {
            switchTurn();
        }
    }

    function switchTurn() {
        gameState.turn = gameState.turn === 'yellow' ? 'green' : 'yellow';
        gameState.phase = 'roll';
        gameState.dice = [];
        gameState.usedDice = [];
        document.getElementById('die1').innerText = '-';
        document.getElementById('die2').innerText = '-';
        logMessage(`Σειρά των ${gameState.turn === 'yellow' ? 'Κίτρινων' : 'Πράσινων'}`);
        updateUI();
    }

    function toggleMode() {
        gameState.againstAI = !gameState.againstAI;
        document.getElementById('mode-btn').innerText = gameState.againstAI ? '🤖 vs AI' : '👥 2 Παίκτες';
        logMessage(gameState.againstAI ? 'Ενεργοποιήθηκε vs AI.' : 'Ενεργοποιήθηκε 2 Παίκτες.');
    }

    function startNewSeries() {
        gameState.seriesScore = { yellow: 0, green: 0 };
        gameState.gameIndex = 0;
        initGameType();
    }

    function logMessage(msg) {
        const box = document.getElementById('log-container');
        box.innerHTML += `<div>> ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function updateUI() {
        document.getElementById('game-status').innerText = gameState.phase === 'roll' ? 
            `Σειρά: ${gameState.turn === 'yellow' ? 'Κίτρινες' : 'Πράσινες'} - Ρίψτε τα ζάρια!` : 
            `Σειρά: ${gameState.turn === 'yellow' ? 'Κίτρινες' : 'Πράσινες'} - Επιλέξτε κίνηση`;
        document.getElementById('series-score').innerText = `Σκορ: Κίτρινες ${gameState.seriesScore.yellow} - ${gameState.seriesScore.green} Πράσινες | Αγώνας ${gameState.gameIndex+1}/3 (${gameState.gameTypes[gameState.gameIndex]})`;
    }

    initGameType();
</script>
</body>
</html>
