<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ΤΑΒΛΑΚΙ ΣΤΟ ΛΙΘΙ</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --board-wood: #4a2e18;
            --board-inner: #2c1810;
            --point-dark: #3a3a3a;
            --point-light: #c87528;
            --checker-green: #2ecc71;
            --checker-green-border: #27ae60;
            --checker-yellow: #f1c40f;
            --checker-yellow-border: #f39c12;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            background: #262626;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0;
            font-size: 1.3rem;
            color: #f1c40f;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls-top {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            background: #34495e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #4e6d8d;
        }

        button.active {
            background: #2980b9;
        }

        .main-container {
            display: flex;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .sidebar {
            flex: 1;
            min-width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel {
            background: #262626;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .panel h3 {
            margin-top: 0;
            font-size: 1rem;
            border-bottom: 1px solid #444;
            padding-bottom: 8px;
            color: #bdc3c7;
        }

        /* Ταμπλό Τάβλι */
        .board-container {
            position: relative;
            background-color: var(--board-wood);
            border: 10px solid #2d1608;
            border-radius: 12px;
            width: 560px;
            height: 420px;
            display: flex;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        .board-half {
            flex: 1;
            display: flex;
            height: 100%;
            position: relative;
        }

        .quadrant {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .bar {
            width: 35px;
            background-color: #1a0d05;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-left: 2px solid #000;
            border-right: 2px solid #000;
            position: relative;
        }

        .point-container {
            flex: 1;
            position: relative;
            display: flex;
        }

        .point-container.top {
            flex-direction: column;
            align-items: center;
        }

        .point-container.bottom {
            flex-direction: column-reverse;
            align-items: center;
            justify-content: flex-start;
        }

        .point {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
        }

        .point.top {
            clip-path: polygon(50% 100%, 0 0, 100% 0);
        }

        .point.bottom {
            clip-path: polygon(50% 0, 0 100%, 100% 100%);
        }

        .point.dark { background-color: var(--point-dark); }
        .point.light { background-color: var(--point-light); }

        .point-number {
            position: absolute;
            font-size: 10px;
            color: #bdc3c7;
            z-index: 2;
            width: 100%;
            text-align: center;
        }
        .top .point-number { bottom: 5px; }
        .bottom .point-number { top: 5px; }

        /* Πούλια - Έντονα Χρώματα */
        .checker {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            position: absolute;
            z-index: 5;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            transition: transform 0.15s ease;
        }

        .checker.yellow {
            background: radial-gradient(circle at 30% 30%, #f1c40f, #d4ac0d);
            border: 2px solid #b7950b;
            color: #7d6608;
        }

        .checker.green {
            background: radial-gradient(circle at 30% 30%, #2ecc71, #27ae60);
            border: 2px solid #1e8449;
            color: #145a32;
        }

        .checker.selected {
            box-shadow: 0 0 10px 3px #3498db, 0 3px 6px rgba(0,0,0,0.6);
            transform: scale(1.1);
        }

        .dice-area {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 10px 0;
        }

        .die {
            width: 40px;
            height: 40px;
            background: white;
            color: black;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .log-box {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            height: 120px;
            overflow-y: auto;
            font-size: 12px;
            font-family: monospace;
            border: 1px solid #333;
        }

        .bear-off {
            position: absolute;
            right: -45px;
            width: 40px;
            height: 45%;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px;
            gap: 2px;
            overflow: hidden;
        }
        .bear-off.top { top: 0; }
        .bear-off.bottom { bottom: 0; }
    </style>
</head>
<body>

    <header>
        <h1>🎲 ΤΑΒΛΑΚΙ ΣΤΟ ΛΙΘΙ</h1>
        <div class="controls-top">
            <span id="series-score" style="font-size: 0.9rem; color: #f1c40f;">Σκορ Σειράς: Κίτρινα 0 - 0 Πράσινα</span>
            <button id="mode-btn" onclick="toggleMode()">👥 2 Παίκτες</button>
            <button id="new-series-btn" onclick="startNewSeries()">🔄 Νέα Σειρά</button>
            <button onclick="alert('Κανόνες: 1ος αγώνας Πόρτες, 2ος Πλακωτό, 3ος Φευγά. Σειρά 3 αγώνων!')">📜 Κανόνες</button>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="panel">
                <h3>ΚΑΤΑΣΤΑΣΗ ΠΑΙΧΝΙΔΙΟΥ</h3>
                <p id="game-status" style="font-weight: bold; color: #f1c40f;">Ρίψτε τα ζάρια!</p>
                <div class="dice-area">
                    <div id="die1" class="die">-</div>
                    <div id="die2" class="die">-</div>
                    <button id="roll-btn" onclick="rollDice()" style="background: #27ae60; padding: 10px 15px;">🎲 Ρίψη Ζαριών</button>
                </div>
            </div>

            <div class="panel">
                <h3>ΙΣΤΟΡΙΚΟ ΚΙΝΗΣΕΩΝ</h3>
                <div id="log-container" class="log-box">
                    Το παιχνίδι ξεκίνησε. Καλή διασκέδαση!
                </div>
            </div>
        </div>

        <div class="board-container" id="board">
            <!-- Bear off areas -->
            <div class="bear-off top" id="bear-off-green" title="Μαζεμένα Πράσινα"></div>
            <div class="bear-off bottom" id="bear-off-yellow" title="Μαζεμένα Κίτρινα"></div>

            <!-- Left Half (Points 12-1) -->
            <div class="board-half">
                <div class="quadrant" id="quad-top-left"></div>
                <div class="quadrant" id="quad-bottom-left"></div>
            </div>
            <div class="bar" id="bar-area"></div>
            <!-- Right Half (Points 13-24) -->
            <div class="board-half">
                <div class="quadrant" id="quad-top-right"></div>
                <div class="quadrant" id="quad-bottom-right"></div>
            </div>
        </div>
    </div>

<script>
    // Javascript logic for backgammon series
    let gameState = {
        board: Array(25).fill(null).map(() => []),
        turn: 'yellow', // yellow or green
        dice: [],
        usedDice: [],
        selectedPoint: null,
        bar: { yellow: 0, green: 0 },
        borneOff: { yellow: 0, green: 0 },
        gameIndex: 0, // 0: Portes, 1: Plakoto, 2: Fevga
        gameTypes: ['Πόρτες', 'Πλακωτό', 'Φευγά'],
        seriesScore: { yellow: 0, green: 0 },
        againstAI: false,
        phase: 'roll' // roll, move, finished
    };

    const pointCoordinates = {};

    function initGameType() {
        gameState.board = Array(25).fill(null).map(() => []);
        gameState.bar = { yellow: 0, green: 0 };
        gameState.borneOff = { yellow: 0, green: 0 };
        gameState.turn = 'yellow';
        gameState.dice = [];
        gameState.usedDice = [];
        gameState.selectedPoint = null;
        gameState.phase = 'roll';

        const type = gameState.gameTypes[gameState.gameIndex];
        logMessage(`Ξεκίνησε το ${type}! Σειρά των Κίτρινων.`);

        if (type === 'Πόρτες') {
            // Standard Portes setup
            gameState.board[1] = Array(2).fill('yellow');
            gameState.board[12] = Array(5).fill('yellow');
            gameState.board[17] = Array(3).fill('yellow');
            gameState.board[19] = Array(5).fill('yellow');

            gameState.board[24] = Array(2).fill('green');
            gameState.board[13] = Array(5).fill('green');
            gameState.board[8] = Array(3).fill('green');
            gameState.board[6] = Array(5).fill('green');
        } else if (type === 'Πλακωτό') {
            gameState.board[1] = Array(15).fill('yellow');
            gameState.board[24] = Array(15).fill('green');
        } else if (type === 'Φευγά') {
            gameState.board[1] = Array(15).fill('yellow');
            gameState.board[13] = Array(15).fill('green');
        }
        renderBoard();
        updateUI();
    }

    function renderBoard() {
        // Clear quadrants
        ['quad-top-left', 'quad-bottom-left', 'quad-top-right', 'quad-bottom-right'].forEach(id => {
            document.getElementById(id).innerHTML = '';
        });

        // Create points 1 to 24
        // Top row: 12 to 1 (left to right), 13 to 18 (left to right in right half) -> wait standard layout:
        // Top left: 12, 11, 10, 9, 8, 7 ? Let's map accurately:
        // Standard backgammon top: 12 to 1 (left to right) or 13 to 18?
        // Let's arrange indices:
        // Top row from left to right: 12, 11, 10, 9, 8, 7 | 13, 14, 15, 16, 17, 18 -> Wait, standard top-left is 12 down to 7, top-right is 13 to 18.
        // Let's map visual points cleanly:
        const topIndicesLeft = [12, 11, 10, 9, 8, 7];
        const bottomIndicesLeft = [13, 14, 15, 16, 17, 18];
        const topIndicesRight = [11, 10, 9, 8, 7, 6]; // We will render dynamically
    }

    // Simplified rendering loop for points
    function renderBoard() {
        const qTL = document.getElementById('quad-top-left');
        const qBL = document.getElementById('quad-bottom-left');
        const qTR = document.getElementById('quad-top-right');
        const qBR = document.getElementById('quad-bottom-right');

        qTL.innerHTML = ''; qBL.innerHTML = ''; qTR.innerHTML = ''; qBR.innerHTML = '';

        // Top left quadrant holds points 12, 11, 10, 9, 8, 7
        // Bottom left holds 13, 14, 15, 16, 17, 18
        // Top right holds 6, 5, 4, 3, 2, 1
        // Bottom right holds 19, 20, 21, 22, 23, 24

        createQuadrantPoints(qTL, [12, 11, 10, 9, 8, 7], 'top');
        createQuadrantPoints(qBL, [13, 14, 15, 16, 17, 18], 'bottom');
        createQuadrantPoints(qTR, [6, 5, 4, 3, 2, 1], 'top');
        createQuadrantPoints(qBR, [19, 20, 21, 22, 23, 24], 'bottom');

        renderBearOffAndBar();
    }

    function createQuadrantPoints(container, indices, position) {
        indices.forEach(idx => {
            const ptDiv = document.createElement('div');
            ptDiv.className = `point-container ${position}`;
            ptDiv.style.flex = '1';
            ptDiv.style.position = 'relative';
            ptDiv.onclick = () => onPointClick(idx);

            const triangle = document.createElement('div');
            triangle.className = `point ${position} ${idx % 2 === 0 ? 'dark' : 'light'}`;
            ptDiv.appendChild(triangle);

            const numLabel = document.createElement('div');
            numLabel.className = 'point-number';
            numLabel.innerText = idx;
            ptDiv.appendChild(numLabel);

            // Render checkers on this point
            const checkers = gameState.board[idx];
            checkers.forEach((color, cIdx) => {
                if (cIdx < 5) { // stack visual limit
                    const chk = document.createElement('div');
                    chk.className = `checker ${color} ${gameState.selectedPoint === idx && cIdx === checkers.length - 1 ? 'selected' : ''}`;
                    
                    // calculate offset
                    const offset = cIdx * 28;
                    if (position === 'top') {
                        chk.style.top = `${offset}px`;
                    } else {
                        chk.style.bottom = `${offset}px`;
                    }
                    ptDiv.appendChild(chk);
                }
            });

            container.appendChild(ptDiv);
        });
    }

    function renderBearOffAndBar() {
        const bGreen = document.getElementById('bear-off-green');
        const bYellow = document.getElementById('bear-off-yellow');
        bGreen.innerHTML = `<small style="font-size:9px">Π:${gameState.borneOff.green}</small>`;
        bYellow.innerHTML = `<small style="font-size:9px">Κ:${gameState.borneOff.yellow}</small>`;
    }

    function rollDice() {
        if (gameState.phase !== 'roll') return;
        const d1 = Math.floor(Math.random() * 6) + 1;
        const d2 = Math.floor(Math.random() * 6) + 1;
        gameState.dice = d1 === d2 ? [d1, d1, d1, d1] : [d1, d2];
        gameState.usedDice = [];
        gameState.phase = 'move';

        document.getElementById('die1').innerText = d1;
        document.getElementById('die2').innerText = d2;
        logMessage(`Ρίψη ζαριών: ${d1}, ${d2} (${gameState.turn === 'yellow' ? 'Κίτρινα' : 'Πράσινα'})`);
        updateUI();

        if (gameState.againstAI && gameState.turn === 'green') {
            setTimeout(aiMove, 800);
        }
    }

    function onPointClick(pointIdx) {
        if (gameState.phase !== 'move') return;
        if (gameState.againstAI && gameState.turn === 'green') return;

        const currentTurn = gameState.turn;

        if (gameState.selectedPoint === null) {
            // Select checker
            const checkers = gameState.board[pointIdx];
            if (checkers.length > 0 && checkers[checkers.length - 1] === currentTurn) {
                gameState.selectedPoint = pointIdx;
                renderBoard();
            }
        } else {
            // Move checker from selectedPoint to pointIdx
            const from = gameState.selectedPoint;
            const to = pointIdx;
            if (isValidMove(from, to)) {
                executeMove(from, to);
                gameState.selectedPoint = null;
                checkTurnCompletion();
            } else {
                // Change selection if clicking own piece
                const checkers = gameState.board[pointIdx];
                if (checkers.length > 0 && checkers[checkers.length - 1] === currentTurn) {
                    gameState.selectedPoint = pointIdx;
                } else {
                    gameState.selectedPoint = null;
                }
                renderBoard();
            }
        }
    }

    function isValidMove(from, to) {
        const dieUsed = gameState.dice.find(d => !gameState.usedDice.includes(d) && Math.abs(to - from) === d);
        if (!dieUsed) return; // Simple distance check approximation for demo
        return true;
    }

    function executeMove(from, to) {
        const distance = Math.abs(to - from);
        const dieIndex = gameState.dice.findIndex((d, idx) => !gameState.usedDice.includes(idx) && d === distance);
        if (dieIndex !== -1) {
            gameState.usedDice.push(dieIndex);
        }

        const piece = gameState.board[from].pop();
        gameState.board[to].push(piece);
        logMessage(`Κίνηση από ${from} σε ${to}`);
        renderBoard();
    }

    function checkTurnCompletion() {
        if (gameState.usedDice.length === gameState.dice.length || gameState.dice.length === 0) {
            switchTurn();
        }
    }

    function switchTurn() {
        gameState.turn = gameState.turn === 'yellow' ? 'green' : 'yellow';
        gameState.phase = 'roll';
        gameState.dice = [];
        gameState.usedDice = [];
        document.getElementById('die1').innerText = '-';
        document.getElementById('die2').innerText = '-';
        logMessage(`Σειρά των ${gameState.turn === 'yellow' ? 'Κίτρινων' : 'Πράσινων'}`);
        updateUI();

        if (gameState.againstAI && gameState.turn === 'green') {
            setTimeout(rollDice, 600);
        }
    }

    function aiMove() {
        if (gameState.phase === 'roll') {
            rollDice();
            return;
        }
        // Basic AI dummy move for smooth gameplay
        setTimeout(() => {
            logMessage('Ο υπολογιστής έπαιξε.');
            switchTurn();
        }, 1000);
    }

    function toggleMode() {
        gameState.againstAI = !gameState.againstAI;
        const btn = document.getElementById('mode-btn');
        btn.innerText = gameState.againstAI ? '🤖 vs AI (CPU)' : '👥 2 Παίκτες';
        logMessage(gameState.againstAI ? 'Λειτουργία vs AI ενεργοποιήθηκε.' : 'Λειτουργία 2 παικτών ενεργοποιήθηκε.');
    }

    function startNewSeries() {
        gameState.seriesScore = { yellow: 0, green: 0 };
        gameState.gameIndex = 0;
        initGameType();
    }

    function logMessage(msg) {
        const box = document.getElementById('log-container');
        box.innerHTML += `<div>> ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function updateUI() {
        document.getElementById('game-status').innerText = gameState.phase === 'roll' ? 
            `Σειρά: ${gameState.turn === 'yellow' ? 'Κίτρινα' : 'Πράσινα'} - Ρίψτε τα ζάρια!` : 
            `Σειρά: ${gameState.turn === 'yellow' ? 'Κίτρινα' : 'Πράσινα'} - Επιλέξτε κίνηση`;
        document.getElementById('series-score').innerText = `Σκορ Σειράς: Κίτρινα ${gameState.seriesScore.yellow} - ${gameState.seriesScore.green} Πράσινα | Αγώνας ${gameState.gameIndex+1}/3 (${gameState.gameTypes[gameState.gameIndex]})`;
    }

    // Initialize board on load
    initGameType();
</script>
</body>
</html>
